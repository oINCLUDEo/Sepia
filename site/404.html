<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — Сепия</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#14100d; --line:#33291f; --amber-soft:#e0ac6a; --text:#f3ede3; --text-muted:#a99c89; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .code{font-family:'Fraunces',serif;font-style:italic;font-weight:300;font-size:6rem;color:var(--amber-soft);line-height:1}
  h1{font-family:'Fraunces',serif;font-weight:400;font-size:1.8rem;margin:18px 0 10px}
  p{color:var(--text-muted);max-width:40ch;margin:0 auto 28px;line-height:1.6}
  a{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:12px 24px;color:var(--text);text-decoration:none;font-size:.9rem;transition:border-color .2s}
  a:hover{border-color:var(--amber-soft)}
</style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>Кадр не найден</h1>
    <p>Такой страницы нет или её перенесли. Вернитесь на главную и начните заново.</p>
    <a href="/">На главную</a>
  </div>
</body>
</html>
