# Правила алертов для vmalert. Пороги «плохо» — те же, что в дашборде (TH в dashboard/index.html):
# поменяли там — поменяйте здесь. Снимки от нод приходят раз в 15 минут, поэтому last_over_time(...[45m]).
groups:
  - name: nodes
    interval: 1m
    rules:
      - alert: NodeSilent
        # новый node-check шлёт снимок каждую минуту (поле period): 10 минут тишины — уже повод
        expr: time() - max by (node) (tlast_over_time(node_quick_period[2d])) > 600
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.node }}: молчит {{ $value | humanizeDuration }}'
          hint: 'Нода не шлёт снимки. Проверить: systemctl status rw-node-check.timer; связь с панелью (порт 9443).'

      - alert: NodeSilentLegacy
        # старый node-check (раз в 15 минут, без поля period) — порог 30 минут
        expr: (time() - max by (node) (tlast_over_time(node_quick_cpu_us[2d])) > 1800) unless on (node) max by (node) (last_over_time(node_quick_period[2d]))
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.node }}: молчит {{ $value | humanizeDuration }}'
          hint: 'Старый node-check без самообновления. На ноде: cd /root/Sepia && git pull && bash node-check.sh install'

      - alert: NodeRetransmits
        # при трафике меньше 1 Мбит/с процент скачет от пары пакетов — такие ноды не трогаем (как в дашборде)
        expr: max by (node) (last_over_time(node_quick_retrans_pct[45m])) > 10 and on (node) max by (node) (last_over_time(node_quick_tx_mbps[45m])) >= 1
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.node }}: ретрансмиты {{ $value | printf "%.1f" }}% уже час'
          hint: 'Потери на маршруте до пользователей. Сравнить пик и тишину: node-check.sh report; mtr до РФ.'

      - alert: NodeSteal
        expr: max by (node) (last_over_time(node_quick_cpu_st[45m])) > 15
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.node }}: steal {{ $value | printf "%.0f" }}% полчаса'
          hint: 'Соседи по хосту забирают CPU. Писать хостеру или переезжать.'

      - alert: NodeLoss
        expr: max by (node) (last_over_time(node_quick_loss_pct[45m])) > 2
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.node }}: потери {{ $value | printf "%.1f" }}%'

      - alert: NodeCPU
        expr: max by (node) (last_over_time(node_quick_cpu_us[45m]) + last_over_time(node_quick_cpu_sy[45m])) > 90
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.node }}: CPU {{ $value | printf "%.0f" }}% полчаса'

      - alert: NodeConntrack
        expr: max by (node) (last_over_time(node_quick_conntrack_pct[45m])) > 90
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.node }}: таблица соединений заполнена на {{ $value | printf "%.0f" }}%'
          hint: 'При 100% новые подключения молча отбрасываются. Поднять nf_conntrack_max (tune-kernel.sh).'

      - alert: NodeMemory
        expr: max by (node) (last_over_time(node_quick_mem_pct[45m])) > 92
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.node }}: память {{ $value | printf "%.0f" }}%'

  - name: masking
    interval: 5m
    rules:
      # нода сама проверяет свою заглушку каждые 10 минут — так, как её видит активный пробер на 443
      - alert: NodeDecoyDown
        expr: max by (node, domain) (last_over_time(node_site_code[30m])) < 200 or max by (node, domain) (last_over_time(node_site_code[30m])) >= 400
        for: 20m
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.node }}: заглушка {{ $labels.domain }} не отвечает как сайт (HTTP {{ $value }})'
          hint: 'Пробер увидит не сайт, а ошибку — прямой путь к бану. На ноде: systemctl status nginx; curl -skI https://{{ $labels.domain }} --resolve {{ $labels.domain }}:443:127.0.0.1'

      - alert: NodeCertInvalid
        expr: max by (node, domain) (last_over_time(node_site_tls_ok[30m])) == 0 and max by (node, domain) (last_over_time(node_site_code[30m])) > 0
        for: 20m
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.node }}: сертификат {{ $labels.domain }} не проходит проверку'
          hint: 'Просрочен или не тот. На ноде: certbot certificates; certbot renew; systemctl reload nginx'

      - alert: NodeCertExpiring
        expr: min by (node, domain) (last_over_time(node_site_cert_days[1h])) < 10
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.node }}: сертификат {{ $labels.domain }} истекает через {{ $value | printf "%.0f" }} дн'
          hint: 'Let’s Encrypt продлевает за 30 дней — значит, продление не проходит. Нода пробует сама ночью; вручную: certbot renew --dry-run (нужен открытый порт 80 и A-запись на эту ноду)'

  - name: panel
    interval: 1m
    rules:
      - alert: NodeMaybeBlocked
        # онлайн ноды меньше 30% от того же часа вчера (было хотя бы 20), по сети в целом падения нет (больше 70%),
        # нода включена и панель её видит — так выглядит блокировка IP в РФ. Те же условия, что на дашборде (BLOCK)
        expr: |
          (
            last_over_time(node_panel_users_online[10m])
              / (last_over_time(node_panel_users_online[30m] offset 1d) >= 20)
          ) < 0.3
          and on (uuid) (last_over_time(node_panel_connected[10m]) == 1)
          and on (uuid) (last_over_time(node_panel_disabled[10m]) == 0)
          and on () (sum(last_over_time(node_panel_users_online[10m])) / sum(last_over_time(node_panel_users_online[30m] offset 1d)) > 0.7)
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.name }}: похоже, IP заблокирован — онлайн {{ $value | humanizePercentage }} от вчерашнего'
          hint: 'Нода жива и видна панели, а люди с неё ушли. Проверить из РФ: curl -m 5 -sI https://домен-ноды. Не отвечает — сменить IP или убрать ноду из Squad.'

      - alert: PanelLostNode
        # включённая в панели нода, которую панель не видит
        expr: (last_over_time(node_panel_connected[15m]) == 0) and on (uuid) (last_over_time(node_panel_disabled[15m]) == 0)
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.name }}: панель не видит ноду'
          hint: 'remnanode не отвечает панели: нода лежит, забанен IP или закрыт NODE_PORT.'

      - alert: StatsSyncStopped
        # rw-sync.py пишет справочник раз в 5 минут; тишина 30 минут — cron или токен Remnawave сломались
        expr: absent_over_time(node_panel_connected[30m])
        labels: {severity: warning}
        annotations:
          summary: 'rw-sync.py не обновлял справочник нод 30 минут'
          hint: 'Проверить: python3 /opt/Sepia/stats/rw-sync.py --dry-run'
