# Правила алертов для vmalert. Пороги «плохо» — те же, что в дашборде (TH в dashboard/index.html):
# поменяли там — поменяйте здесь. Снимки от нод приходят раз в 15 минут, поэтому last_over_time(...[45m]).
groups:
  - name: nodes
    interval: 1m
    rules:
      - alert: NodeSilent
        # max by (node): у ноды бывают две серии (до и после обновления node-check), смотрим на свежую
        expr: time() - max by (node) (tlast_over_time(node_quick_cpu_us[2d])) > 1800
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.node }}: молчит {{ $value | humanizeDuration }}'
          hint: 'Нода не шлёт снимки. Проверить cron node-check и связь с панелью (порт 9443).'

      - alert: NodeRetransmits
        # при трафике меньше 1 Мбит/с процент скачет от пары пакетов — такие ноды не трогаем (как в дашборде)
        expr: max by (node) (last_over_time(node_quick_retrans_pct[45m])) > 10 and on (node) max by (node) (last_over_time(node_quick_tx_mbps[45m])) >= 1
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.node }}: ретрансмиты {{ $value | printf "%.1f" }}% уже час'
          hint: 'Потери на маршруте до пользователей. Сравнить пик и тишину: node-check.sh report; mtr до РФ.'

      - alert: NodeSteal
        expr: max by (node) (last_over_time(node_quick_cpu_st[45m])) > 15
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.node }}: steal {{ $value | printf "%.0f" }}% полчаса'
          hint: 'Соседи по хосту забирают CPU. Писать хостеру или переезжать.'

      - alert: NodeLoss
        expr: max by (node) (last_over_time(node_quick_loss_pct[45m])) > 2
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.node }}: потери {{ $value | printf "%.1f" }}%'

      - alert: NodeCPU
        expr: max by (node) (last_over_time(node_quick_cpu_us[45m]) + last_over_time(node_quick_cpu_sy[45m])) > 90
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.node }}: CPU {{ $value | printf "%.0f" }}% полчаса'

      - alert: NodeConntrack
        expr: max by (node) (last_over_time(node_quick_conntrack_pct[45m])) > 90
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.node }}: таблица соединений заполнена на {{ $value | printf "%.0f" }}%'
          hint: 'При 100% новые подключения молча отбрасываются. Поднять nf_conntrack_max (tune-kernel.sh).'

      - alert: NodeMemory
        expr: max by (node) (last_over_time(node_quick_mem_pct[45m])) > 92
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.node }}: память {{ $value | printf "%.0f" }}%'

  - name: panel
    interval: 1m
    rules:
      - alert: PanelLostNode
        # включённая в панели нода, которую панель не видит
        expr: (last_over_time(node_panel_connected[15m]) == 0) and on (uuid) (last_over_time(node_panel_disabled[15m]) == 0)
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.name }}: панель не видит ноду'
          hint: 'remnanode не отвечает панели: нода лежит, забанен IP или закрыт NODE_PORT.'

      - alert: StatsSyncStopped
        # rw-sync.py пишет справочник раз в 5 минут; тишина 30 минут — cron или токен Remnawave сломались
        expr: absent_over_time(node_panel_connected[30m])
        labels: {severity: warning}
        annotations:
          summary: 'rw-sync.py не обновлял справочник нод 30 минут'
          hint: 'Проверить: python3 /opt/Sepia/stats/rw-sync.py --dry-run'
