# VictoriaMetrics — приёмник статистики нод (node-check.sh шлёт сюда снимки каждые 15 мин).
# Ставится на сервер ПАНЕЛИ рядом с Remnawave, в её docker-сеть: Caddy проксирует
# https://panel.ulya.space/node-stats/* -> node-stats:8428 (новый поддомен не нужен — его серт не выпустится
# из-за DOCKER-USER). Запись: /node-stats/write, графики: /node-stats/vmui. Снаружи вход — только через Caddy.
#
#   cp .env.example .env   # задать VM_PASS: openssl rand -hex 24
#   docker compose up -d
services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.1
    container_name: node-stats
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=180d
      - -http.pathPrefix=/node-stats
      # без своего пароля: снаружи её не видно (docker-сеть и 127.0.0.1), пароли проверяют на входе —
      # Caddy на 443 (чтение: дашборд, vmui; VM_USER/VM_PASS) и шлюз на 9443 (запись нод; writer/VM_WRITE_PASS).
      # Опасные действия — только с отдельным ключом VM_ADMIN_KEY (его нет ни у дашборда, ни у нод): даже если
      # запрос на удаление или снимок дойдёт сюда через Caddy, без ключа он не сработает
      - -deleteAuthKey=${VM_ADMIN_KEY:?задай VM_ADMIN_KEY в .env — openssl rand -hex 24}
      - -snapshotAuthKey=${VM_ADMIN_KEY}
      - -forceMergeAuthKey=${VM_ADMIN_KEY}
      - -forceFlushAuthKey=${VM_ADMIN_KEY}
      - -search.resetCacheAuthKey=${VM_ADMIN_KEY}
      - -configAuthKey=${VM_ADMIN_KEY}
      - -flagsAuthKey=${VM_ADMIN_KEY}
      - -pprofAuthKey=${VM_ADMIN_KEY}
    volumes:
      - ./data:/storage
    ports:
      - "127.0.0.1:8428:8428"   # для проверок curl с самого сервера
    networks:
      - remnawave-network

  # Дашборд: статическая страница, данные берёт у VictoriaMetrics по /node-stats/api/v1 (логин/пароль — те же).
  # Снаружи: https://panel.ulya.space/node-stats/dash/ (Caddy панели снимает префикс и проксирует сюда).
  dashboard:
    image: caddy:2.9
    container_name: node-dash
    restart: unless-stopped
    # свой Caddyfile: скрипты без долгого кэша — после git pull браузер сразу берёт новую версию
    volumes:
      - ./dashboard:/srv:ro
      - ./dash/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - remnawave-network

  # Вход в дашборд и vmui по cookie: Caddy перед каждым запросом к /node-stats/* спрашивает этот сервис (forward_auth).
  # Пароль в браузере не хранится; curl по-прежнему может ходить с логином и паролем (Basic). Блок для Caddyfile — stats/Caddyfile.snippet
  auth:
    image: python:3.12-alpine
    container_name: node-auth
    restart: unless-stopped
    command: ["python", "-I", "-u", "/app/auth.py"]
    user: "65534:65534"
    read_only: true
    environment:
      VM_USER: ${VM_USER:-node}
      VM_PASS: ${VM_PASS:?задай VM_PASS в .env}
      AUTH_SECRET: ${AUTH_SECRET:?задай AUTH_SECRET в .env — openssl rand -hex 32}
      # заметки на графиках: node-auth пишет их в VictoriaMetrics внутри docker-сети, удаляет — с ключом администратора
      VM_URL: http://node-stats:8428/node-stats
      VM_ADMIN_KEY: ${VM_ADMIN_KEY}
      # выключать хосты заблокированной ноды из дашборда: токен Remnawave (Настройки → API-токены), без него кнопка покажет, что не настроено
      RW_API: ${RW_API:-http://remnawave:3000/api}
      RW_TOKEN: ${RW_TOKEN:-}
      SUSP_DEVICES: ${SUSP_DEVICES:-5}
      SUSP_IPS: ${SUSP_IPS:-6}
      SUSP_APPS: ${SUSP_APPS:-4}
      SUSP_TRAFFIC_X: ${SUSP_TRAFFIC_X:-8}
      SUSP_TRAFFIC_GB: ${SUSP_TRAFFIC_GB:-150}
      # «Пользователи»: тарифы по лимитам — id:цена:ГБ:устройств (0 ГБ — безлимит, цена 0 — пробная); служебные и тестовые
      # аккаунты отсеиваются по имени/тегу/описанию (USERS_SKIP, регулярное выражение) и бессрочной подписке (USERS_SKIP_DAYS)
      TARIFFS: ${TARIFFS:-trial:0:5:5,99:99:20:1,149:149:50:2,199:199:0:2,299:299:0:5}
      EXTRA_DEVICE: ${EXTRA_DEVICE:-100}
      TRIAL_DAYS: ${TRIAL_DAYS:-5}
      USERS_SKIP: ${USERS_SKIP:-}
      USERS_SKIP_DAYS: ${USERS_SKIP_DAYS:-400}
      # второй пароль — для автонастройки нод по SSH из мастера «Новая нода» (пусто — автонастройка выключена)
      ADMIN_PASS: ${ADMIN_PASS:-}
      SETUP_URL: http://node-setup:8092
    volumes:
      - ./auth/auth.py:/app/auth.py:ro
    networks:
      - remnawave-network

  # Автонастройка новой ноды по SSH (мастер «Новая нода» → «Настроить автоматически»): пакеты, Sepia, ожидание DNS,
  # provision-node.sh, remnanode из docker-compose.yml панели, node-check. Снаружи недоступен — зовёт только node-auth
  # (после проверки ADMIN_PASS). Пароль SSH живёт только в памяти на время задания; журналы — в ./setup/state
  setup:
    image: python:3.12-alpine
    container_name: node-setup
    restart: unless-stopped
    command: ["sh", "-c", "apk add --no-cache openssh-client sshpass >/dev/null && exec python -I -u /app/setup.py"]
    environment:
      VM_WRITE_PASS: ${VM_WRITE_PASS:?задай VM_WRITE_PASS в .env}
      # пробник для «Рынка» (probe/setup.sh на отдельном сервере печатает эти три строки): подписки, пробив выходов, доступность
      PROBE_URL: ${PROBE_URL:-}
      PROBE_TOKEN: ${PROBE_TOKEN:-}
      PROBE_FP: ${PROBE_FP:-}
      DATA: /data
    volumes:
      - ./setup/setup.py:/app/setup.py:ro
      - ./setup/state:/data
    networks:
      - remnawave-network

  # Вход для нод только на запись: https://panel.ulya.space:9443/node-stats/write (логин writer, VM_WRITE_PASS).
  # Не зависит от белого списка IP в DOCKER-USER (он режет только 80/443/8080). Правила — в vmauth.yml.
  gateway:
    image: victoriametrics/vmauth:v1.154.1
    container_name: node-stats-gw
    restart: unless-stopped
    user: "0:0"   # ключ сертификата Caddy читается только root
    command:
      - -auth.config=/etc/vmauth.yml
      - -httpListenAddr=:9443
      - -tls
      # серт Caddy для panel.ulya.space; перечитывается сам раз в секунду, продление подхватится
      # shortcut: путь от Let's Encrypt; если Caddy перейдёт на другой ACME-центр (ZeroSSL), поправить путь
      - -tlsCertFile=/caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/panel.ulya.space/panel.ulya.space.crt
      - -tlsKeyFile=/caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/panel.ulya.space/panel.ulya.space.key
      - -maxConcurrentRequests=50
      # служебные /debug/pprof, /metrics, /flags, /-/reload иначе открыты всем на 9443
      - -pprofAuthKey=${VM_PASS:?задай VM_PASS в .env}
      - -metricsAuthKey=${VM_PASS}
      - -flagsAuthKey=${VM_PASS}
      - -reloadAuthKey=${VM_PASS}
    environment:
      VM_WRITE_PASS: ${VM_WRITE_PASS:?задай VM_WRITE_PASS в .env}
    volumes:
      - ./vmauth.yml:/etc/vmauth.yml:ro
      - caddy-ssl-data:/caddy:ro
    ports:
      - "9443:9443"
    networks:
      - remnawave-network
    depends_on:
      - victoriametrics

  # Алерты в Telegram (по желанию): docker compose --profile alerts up -d
  # Перед запуском: cp alerts/alertmanager.yml.example alerts/alertmanager.yml (вписать chat_id)
  # и положить токен бота в alerts/tg_token (chmod 644: Alertmanager читает его от nobody). Правила и пороги — alerts/rules.yml.
  alerts:
    image: victoriametrics/vmalert:v1.154.1
    container_name: node-stats-alerts
    restart: unless-stopped
    profiles: ["alerts"]
    command:
      - -rule=/etc/alerts/rules.yml
      - -datasource.url=http://node-stats:8428/node-stats
      - -notifier.url=http://node-stats-am:9093
      - -evaluationInterval=1m
      - -external.url=https://panel.ulya.space/node-stats/dash/
    volumes:
      - ./alerts/rules.yml:/etc/alerts/rules.yml:ro
    networks:
      - remnawave-network
    depends_on:
      - victoriametrics
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: node-stats-am
    restart: unless-stopped
    profiles: ["alerts"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=   # одиночный экземпляр, без кластера
    volumes:
      - ./alerts/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alerts/tg_token:/etc/alertmanager/tg_token:ro
      - am-data:/alertmanager   # именованный том: Alertmanager пишет от nobody, в папку хоста не сможет
    networks:
      - remnawave-network

networks:
  remnawave-network:
    external: true

volumes:
  caddy-ssl-data:   # том Caddy панели с сертификатами (только чтение)
    external: true
  am-data:          # состояние Alertmanager (какие алерты уже отправлены)
