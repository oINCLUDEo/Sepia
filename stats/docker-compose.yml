# VictoriaMetrics — приёмник статистики нод (node-check.sh шлёт сюда снимки каждые 15 мин).
# Ставится на сервер ПАНЕЛИ рядом с Remnawave, в её docker-сеть: Caddy проксирует
# https://panel.ulya.space/node-stats/* -> node-stats:8428 (новый поддомен не нужен — его серт не выпустится
# из-за DOCKER-USER). Запись: /node-stats/write, графики: /node-stats/vmui. Снаружи вход — только через Caddy.
#
#   cp .env.example .env   # задать VM_PASS: openssl rand -hex 24
#   docker compose up -d
services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.1
    container_name: node-stats
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=180d
      - -http.pathPrefix=/node-stats
      # без своего пароля: снаружи её не видно (docker-сеть и 127.0.0.1), пароли проверяют на входе —
      # Caddy на 443 (чтение: дашборд, vmui; VM_USER/VM_PASS) и шлюз на 9443 (запись нод; writer/VM_WRITE_PASS)
    volumes:
      - ./data:/storage
    ports:
      - "127.0.0.1:8428:8428"   # для проверок curl с самого сервера
    networks:
      - remnawave-network

  # Дашборд: статическая страница, данные берёт у VictoriaMetrics по /node-stats/api/v1 (логин/пароль — те же).
  # Снаружи: https://panel.ulya.space/node-stats/dash/ (Caddy панели снимает префикс и проксирует сюда).
  dashboard:
    image: caddy:2.9
    container_name: node-dash
    restart: unless-stopped
    command: caddy file-server --root /srv --listen :8080
    volumes:
      - ./dashboard:/srv:ro
    networks:
      - remnawave-network

  # Вход для нод только на запись: https://panel.ulya.space:9443/node-stats/write (логин writer, VM_WRITE_PASS).
  # Не зависит от белого списка IP в DOCKER-USER (он режет только 80/443/8080). Правила — в vmauth.yml.
  gateway:
    image: victoriametrics/vmauth:v1.154.1
    container_name: node-stats-gw
    restart: unless-stopped
    user: "0:0"   # ключ сертификата Caddy читается только root
    command:
      - -auth.config=/etc/vmauth.yml
      - -httpListenAddr=:9443
      - -tls
      # серт Caddy для panel.ulya.space; перечитывается сам раз в секунду, продление подхватится
      # shortcut: путь от Let's Encrypt; если Caddy перейдёт на другой ACME-центр (ZeroSSL), поправить путь
      - -tlsCertFile=/caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/panel.ulya.space/panel.ulya.space.crt
      - -tlsKeyFile=/caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/panel.ulya.space/panel.ulya.space.key
      - -maxConcurrentRequests=50
      # служебные /debug/pprof, /metrics, /flags, /-/reload иначе открыты всем на 9443
      - -pprofAuthKey=${VM_PASS:?задай VM_PASS в .env}
      - -metricsAuthKey=${VM_PASS}
      - -flagsAuthKey=${VM_PASS}
      - -reloadAuthKey=${VM_PASS}
    environment:
      VM_WRITE_PASS: ${VM_WRITE_PASS:?задай VM_WRITE_PASS в .env}
    volumes:
      - ./vmauth.yml:/etc/vmauth.yml:ro
      - caddy-ssl-data:/caddy:ro
    ports:
      - "9443:9443"
    networks:
      - remnawave-network
    depends_on:
      - victoriametrics

networks:
  remnawave-network:
    external: true

volumes:
  caddy-ssl-data:   # том Caddy панели с сертификатами (только чтение)
    external: true
